name: Build flashable kernel ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in the ZIP name and release tag
        required: true
        default: saisei
        type: string
      defconfig:
        description: Device configuration fragment
        required: true
        default: selene_defconfig
        type: string
      ksu_ref:
        description: backslashxx/KernelSU tag or commit
        required: true
        default: v3.3.0
        type: string
  push:
    branches:
      - main

permissions:
  contents: write

# A rerun receives a new run_attempt, so every successful build has a unique tag.
concurrency:
  group: kernel-release-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  build:
    name: Build selene arm64 with KernelSU
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: ${{ inputs.defconfig || 'selene_defconfig' }}
      BUILD_VERSION: ${{ inputs.version || 'saisei' }}
      KSU_REF: ${{ inputs.ksu_ref || 'v3.3.0' }}
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabihf-

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio dwarves \
            gcc-12-aarch64-linux-gnu gcc-12-arm-linux-gnueabihf \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf \
            device-tree-compiler zip unzip python3
          sudo ln -sf /usr/bin/arm-linux-gnueabihf-gcc-12 \
            /usr/local/bin/arm-linux-gnueabihf-gcc

      - name: Integrate KernelSU for legacy kernels
        run: |
          set -euxo pipefail
          curl -LSs \
            "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" \
            | bash -s "$KSU_REF"

          test -L drivers/kernelsu
          test -f KernelSU/kernel/Kconfig
          resolved_ksu="$(git -C KernelSU describe --tags --always)"
          echo "KSU_VERSION=$resolved_ksu" >> "$GITHUB_ENV"

      - name: Configure kernel
        run: |
          set -euxo pipefail
          test -f "arch/arm64/configs/${KERNEL_DEFCONFIG}"

          make O=out ARCH="$ARCH" stock_defconfig
          scripts/kconfig/merge_config.sh -m -O out \
            out/.config "arch/arm64/configs/${KERNEL_DEFCONFIG}"

          # Compatibility choices are applied only to the generated config.
          scripts/config --file out/.config --disable CC_STACKPROTECTOR_STRONG
          scripts/config --file out/.config --disable LTO_CLANG
          scripts/config --file out/.config --disable LTO_CLANG_THIN
          scripts/config --file out/.config --set-str MICROTRUST_TEE_VERSION 300

          # backslashxx/KernelSU supports old non-GKI kernels. ARM64 branch-link
          # hooking is the fork's recommended mode for Linux 4.19 and newer.
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable KSU_HACK_ARM64_BRANCH_LINK
          sed -i 's/cortex-a75\.cortex-a75/cortex-a75/g' out/.config

          make O=out ARCH="$ARCH" \
            CC=aarch64-linux-gnu-gcc-12 \
            HOSTCC=gcc \
            olddefconfig </dev/null

          grep -q '^CONFIG_KSU=y' out/.config
          grep -q '^CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y' out/.config

      - name: Build kernel, DTB and DTBO
        run: |
          set -euxo pipefail
          make -j"$(nproc)" O=out ARCH="$ARCH" \
            CC=aarch64-linux-gnu-gcc-12 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_COMPAT="$CROSS_COMPILE_COMPAT" \
            LD=aarch64-linux-gnu-ld \
            KCFLAGS="-Wno-error" \
            Image.gz-dtb dtbo.img

          test -s out/arch/arm64/boot/Image.gz-dtb
          test -s out/arch/arm64/boot/dts/mediatek/mt6768.dtb
          test -s out/arch/arm64/boot/dtbo.img

      - name: Assemble reference-compatible flashable ZIP
        id: package
        run: |
          set -euxo pipefail
          cp -a anykernel-template package
          mkdir -p package/modules/system/lib/modules package/patch package/ramdisk

          cp out/arch/arm64/boot/Image.gz-dtb package/Image.gz-dtb
          cp out/arch/arm64/boot/dts/mediatek/mt6768.dtb package/dtb
          cp out/arch/arm64/boot/dtbo.img package/dtbo.img

          safe_version="$(printf '%s' "$BUILD_VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          safe_ksu="$(printf '%s' "$KSU_VERSION" | tr -cs 'A-Za-z0-9._-' '-')"
          timestamp="$(date -u +'%y%m%d-%H%M%S')"
          short_sha="${GITHUB_SHA::9}"
          zip_name="niigo-yuki-${safe_version}-ksu-${safe_ksu}-${timestamp}-${short_sha}.zip"
          tag="build-${safe_version}-ksu-${safe_ksu}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${timestamp}"

          (
            cd package
            zip -r9 "../${zip_name}" \
              Image.gz-dtb LICENSE META-INF anykernel.sh banner dtb dtbo.img \
              modules patch ramdisk tools
          )

          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify ZIP structure against reference
        env:
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
        run: |
          set -euxo pipefail
          unzip -t "$ZIP_NAME"
          unzip -Z1 "$ZIP_NAME" | LC_ALL=C sort > actual-zip-files.txt
          LC_ALL=C sort .github/reference-zip-files.txt > expected-zip-files.txt
          diff -u expected-zip-files.txt actual-zip-files.txt

          dtb_size="$(stat -c %s package/dtb)"
          tail -c "$dtb_size" package/Image.gz-dtb | cmp - package/dtb

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_NAME: ${{ steps.package.outputs.zip_name }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
        run: |
          set -euxo pipefail
          gh release create "$RELEASE_TAG" "$ZIP_NAME" \
            --target "$GITHUB_SHA" \
            --title "growlkernel ${BUILD_VERSION} + KernelSU ${KSU_VERSION} build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "Automated flashable kernel ZIP for Xiaomi selene/s/eos with backslashxx/KernelSU ${KSU_VERSION}. Defconfig: ${KERNEL_DEFCONFIG}. Commit: ${GITHUB_SHA}."
