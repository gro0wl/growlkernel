name: Build flashable kernel ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_DEFCONFIG: selene_defconfig
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev cpio dwarves \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf zip unzip python3
      - name: Build kernel
        run: |
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_COMPAT=arm-linux-gnueabihf-
          export CC=aarch64-linux-gnu-gcc
          export LD=aarch64-linux-gnu-ld
          export AR=aarch64-linux-gnu-ar
          export NM=aarch64-linux-gnu-nm
          export OBJCOPY=aarch64-linux-gnu-objcopy
          export OBJDUMP=aarch64-linux-gnu-objdump
          export STRIP=aarch64-linux-gnu-strip
          make O=out ARCH=$ARCH $KERNEL_DEFCONFIG
          sed -i "s/^CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/" out/.config
          sed -i -e "s/^CONFIG_LTO_CLANG=y/# CONFIG_LTO_CLANG is not set/" -e "s/^CONFIG_LTO_CLANG_THIN=y/# CONFIG_LTO_CLANG_THIN is not set/" out/.config
          sed -i "s/cortex-a75\.cortex-a75/cortex-a75/g" out/.config
          yes "" | make O=out ARCH=$ARCH olddefconfig
          make -j"$(nproc)" O=out ARCH=$ARCH CROSS_COMPILE=$CROSS_COMPILE LD=$LD KCFLAGS=-Wno-error=misleading-indentation \
            Image.gz dtbs
      - name: Assemble AnyKernel3 ZIP
        run: |
          set -eux
          rm -rf package
          cp -a anykernel-template package
          cp out/arch/arm64/boot/Image.gz-dtb package/Image.gz-dtb 2>/dev/null || \
            cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/mediatek/mt6768*.dtb > package/Image.gz-dtb
          find out/arch/arm64/boot/dts -name '*.dtb' -print0 | xargs -0 cat > package/dtb
          if [ -f out/arch/arm64/boot/dtbo.img ]; then cp out/arch/arm64/boot/dtbo.img package/dtbo.img; fi
          printf 'growlkernel selene arm64\n' > package/banner
          (cd package && zip -r9 "../growlkernel-${{ matrix.arch }}-${GITHUB_RUN_NUMBER}.zip" .)
      - name: Create GitHub release (one release per architecture)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ matrix.arch }}-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "growlkernel-${{ matrix.arch }}-${GITHUB_RUN_NUMBER}.zip" \
            --title "growlkernel ${{ matrix.arch }} build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated flashable ZIP for ${{ matrix.arch }} (commit ${GITHUB_SHA})."
